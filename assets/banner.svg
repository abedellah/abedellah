<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Mohamed Abdellah Lagrini, cybersécurité, GRC, IAM, DevSecOps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13161B"/><stop offset="1" stop-color="#2A2F38"/></linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#C9D6EA"/><stop offset="1" stop-color="#8CA0BF"/></linearGradient>
    <linearGradient id="shield" gradientUnits="userSpaceOnUse" x1="880" y1="20" x2="1180" y2="260"><stop offset="0" stop-color="#8CA0BF"/><stop offset="1" stop-color="#3A4250"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="280" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>

    <!-- faint grid texture -->
    <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1">
      <line x1="0" y1="70" x2="1200" y2="70"/>
      <line x1="0" y1="210" x2="1200" y2="210"/>
    </g>

    <!-- large watermark shield with a governance checkmark, right side -->
