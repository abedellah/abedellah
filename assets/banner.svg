      <path d="M80 128 L122 168 L202 86" fill="none" stroke="url(#shield)" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g font-family="'Segoe UI',Arial,sans-serif">
      <text x="64" y="96" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Mohamed Abdellah Lagrini</text>
      <rect x="65" y="112" width="120" height="3" rx="1.5" fill="url(#accent)"/>

      <text x="64" y="152" font-size="22" font-weight="600" fill="url(#accent)">GRC &#183; IAM &#183; R&#233;seaux &#183; DevSecOps</text>
      <text x="64" y="183" font-size="16" fill="#9AA3B2">&#201;l&#232;ve ing&#233;nieur cybers&#233;curit&#233; &#183; EMSI, Rabat &#183; Sal&#233;, Maroc</text>

      <rect x="64" y="208" width="470" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#B5C6DE" stroke-opacity="0.45"/>
      <text x="299" y="233" font-size="15" fill="#E8EBF0" text-anchor="middle">PFE f&#233;vrier 2027 &#183; France ou Maroc &#183; 6 mois</text>
    </g>
