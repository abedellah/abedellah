<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mohamed Abdellah Lagrini, cybersécurité, GRC, IAM, DevSecOps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A2A"/>
      <stop offset="1" stop-color="#1F3350"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78AFAA"/>
      <stop offset="1" stop-color="#8FA8C8"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78AFAA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#78AFAA" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#78AFAA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- scanning band -->
    <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 420" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- network -->
    <g stroke="url(#accent)" stroke-opacity="0.5" stroke-width="1.4" fill="none">
      <line x1="960" y1="165" x2="770" y2="70"/>
      <line x1="960" y1="165" x2="800" y2="255"/>
      <line x1="960" y1="165" x2="1110" y2="60"/>
      <line x1="960" y1="165" x2="1130" y2="245"/>
      <line x1="960" y1="165" x2="1070" y2="160"/>
      <line x1="770" y1="70" x2="860" y2="28"/>
      <line x1="1110" y1="60" x2="1170" y2="130"/>
      <line x1="800" y1="255" x2="900" y2="300"/>
      <line x1="1130" y1="245" x2="1060" y2="300"/>
    </g>
    <g fill="#78AFAA">
      <circle cx="770" cy="70" r="4"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="255" r="4"><animate attributeName="r" values="3;6;3" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="60" r="4"><animate attributeName="r" values="3;6;3" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="245" r="4"><animate attributeName="r" values="3;6;3" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="1070" cy="160" r="4"><animate attributeName="r" values="3;6;3" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#8FA8C8" fill-opacity="0.8">
      <circle cx="860" cy="28" r="3"/><circle cx="1170" cy="130" r="3"/>
      <circle cx="900" cy="300" r="3"/><circle cx="1060" cy="300" r="3"/>
    </g>

    <!-- shield and lock -->
    <path d="M960 88 L1024 113 V170 C1024 208 997 236 960 254 C923 236 896 208 896 170 V113 Z"
          fill="#78AFAA" fill-opacity="0.055" stroke="url(#accent)" stroke-width="3"/>
    <rect x="941" y="163" width="38" height="30" rx="6" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M949 163 v-9 a11 11 0 0 1 22 0 v9" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="960" cy="178" r="3.5" fill="#78AFAA"/>

    <!-- text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="60" y="118" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="1">MOHAMED ABDELLAH LAGRINI</text>
      <text x="60" y="166" font-size="24" font-weight="600" fill="url(#accent)">Cybersécurité · GRC · IAM · DevSecOps</text>
      <text x="60" y="204" font-size="18" fill="#A8B5C7">Élève ingénieur · EMSI, Rabat</text>
      <rect x="60" y="232" width="470" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#accent)" stroke-opacity="0.5"/>
      <text x="82" y="257" font-size="16" fill="#DCE3EC">PFE février 2027 · GRC · Audit IT · Cyber Risk</text>
    </g>
  </g>
</svg>
